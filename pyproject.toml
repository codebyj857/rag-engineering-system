[project]
name = "rag-engineering-system"
version = "0.1.0"
description = "A production-oriented Retrieval-Augmented Generation system."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "matplotlib>=3.11.2",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.vercel]
entrypoint = "src/rag_engine/main.py:app"